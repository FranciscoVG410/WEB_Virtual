<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="STYLE.CSS">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:ital,wght@0,400;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="imgs/onepieceBackground.jpg">
</head>
    <title>FORMULARIO DE USUARIO</title>
</head>
<body>
    <div id="container">
        <div id="container2">
            <h1 id="manga">MANGA</h1>
            <h1 id="register">Register</h1>
        </div>

        <Form>
        <label for="title">Title: </label>
        <input type="text" name="title" required>

        <label for="gender">Gender: </label>
        <select name="" id="">
            <option value="">Seleccionar</option>
            <option value="action">Action</option>
            <option value="romance">Romance</option>
            <option value="fantasy">Fantasy</option>
            <option value="horror">Horror</option>
            <option value="mecha">Mecha</option>
            <option value="comedy">Comedy</option>
        </select>

        <br>
        <label for="demographic">Demographic: </label>
        <input type="radio" id="shonen" name="demographic" value="Shōnen">
        <label for="shonen">Shōnen</label>

        <input type="radio" id="shojo" name="demographic" value="Shōjo">
        <label for="shojo">Shōjo</label>

        <input type="radio" id="seinen" name="demographic" value="Seinen">
        <label for="seinen">Seinen</label>
        
        <br>

        <label for="volume">Volume: </label>
        <input type="number" name="volume" required>

        <label for="autor">Autor:</label>
        <input type="text" name="autor">

        <label for="editorial">Editorial:</label>
        <input type="text" name="editorial">

        <label for="language">Language: </label>
        <input type="text" name="language" required>
        
        <label for="date">Date of publish:</label>
        <input type="date" name="date">

        <label for="characters">Principal Character:</label>
        <input type="text" name="characters">

        <input type="checkbox" name="yes">

        <label for="">ALL THE INFO IS CORRECT</label>
        <br>
        <button type="submit">SUBMIT</button>
        </Form>
    </div>
</body>
</html>
